[project]
name = "prospection-worker"
version = "0.1.0"
description = "Prospection locale : découverte d'entreprises, site officiel, audit passif, scoring explicable"
requires-python = ">=3.11"
dependencies = [
    "PyMySQL>=1.1",
    "httpx>=0.27",
    "selectolax>=0.3.21",   # parsing HTML rapide (nettoyage)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
