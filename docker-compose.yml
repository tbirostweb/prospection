# ════════════════════════════════════════════════════════════════════
# Déploiement Dokploy (type : Compose)
#
# Dokploy fournit Traefik + Let's Encrypt : on n'expose donc PAS 80/443 et
# on ne met pas de reverse-proxy ici. Le service `web` est joint au réseau
# externe `dokploy-network` ; on attribue le domaine dans l'onglet "Domains"
# de Dokploy (service: web, port: 3000). Les labels Traefik ci-dessous sont
# une alternative si tu préfères router à la main.
#
# Variables : à définir dans Dokploy → onglet "Environment" (écrit le .env).
# ════════════════════════════════════════════════════════════════════

services:
  mysql:
    # MySQL 8.0 : fin de support annoncée par Oracle (avril 2026) — montée vers 8.4 LTS à planifier AVEC sauvegarde/restauration testée
    # (voir docs/SECURITE.md). Digest épinglé = version 8.0 la plus récente au 04/10/2026, pour des déploiements reproductibles.
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    # Plugin d'auth natif : évite d'ajouter une dépendance crypto côté drivers.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Migrations jouées uniquement au premier démarrage (volume vierge)
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    # Réseau interne SANS accès Internet : la base n'est joignable que par web et worker.
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      # Laisse le temps à MySQL d'initialiser la base + jouer les migrations au 1er boot
      start_period: 90s

  searxng:
    # Image construite depuis searxng/ : settings.yml y est embarqué (un montage relatif n'est pas appliqué par Dokploy).
    # Après une modification de searxng/settings.yml : redéployer avec reconstruction de l'image.
    build: ./searxng
    restart: unless-stopped
    environment:
      # Obligatoire : le déploiement échoue avec ce message si la variable manque (sinon secret vide).
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET manquant (onglet Environment de Dokploy)}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - searxng_cache:/var/cache/searxng
    # Accès Internet (moteurs de recherche) ; aucun accès à la base.
    networks: [egress]

  web:
    build: ./web
    restart: unless-stopped
    # Moindre privilège : web ne reçoit QUE ses variables (pas le mot de passe root MySQL, ni le jeton Telegram, ni les clés d'API).
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_URL: ${APP_URL:-}
      AUTH_MAX_FAILURES: ${AUTH_MAX_FAILURES:-}
      AUTH_BLOCK_MINUTES: ${AUTH_BLOCK_MINUTES:-}
      LOCAL_ENGINE_DAILY_BUDGET: ${LOCAL_ENGINE_DAILY_BUDGET:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [db, dokploy-network]
    expose:
      - "3000"
    # Processus non root (USER node dans l'image), aucune capacité Linux, pas d'élévation de privilèges.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Santé réelle : /api/health (base joignable), authentifié avec les identifiants de l'app (web/healthcheck.js).
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTP (port 80) -> redirige vers HTTPS
      - traefik.http.routers.prospection-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.prospection-web.entrypoints=web
      - traefik.http.routers.prospection-web.middlewares=prospection-redirect
      - traefik.http.middlewares.prospection-redirect.redirectscheme.scheme=https
      # HTTPS (port 443) + certificat Let's Encrypt
      - traefik.http.routers.prospection-secure.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.prospection-secure.entrypoints=websecure
      - traefik.http.routers.prospection-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.prospection-secure.service=prospection-web
      - traefik.http.services.prospection-web.loadbalancer.server.port=3000

  worker-init:
    # Tâche ponctuelle : remet le volume des journaux au propriétaire du worker non root (UID 10001), puis s'arrête.
    # Nécessaire une seule fois pour les volumes créés quand le worker tournait en root ; sans effet ensuite.
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: "no"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "chown -R 10001:10001 /app/logs && chmod 750 /app/logs"]
    volumes:
      - worker_logs:/app/logs

  worker:
    # Contexte = racine du dépôt pour embarquer db/updates dans l'image.
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
    depends_on:
      mysql:
        condition: service_healthy
      worker-init:
        condition: service_completed_successfully
    # db : base (sans Internet) ; egress : sites, API publiques, SearXNG, Telegram.
    networks: [db, egress]
    # Processus non root (USER app, UID 10001), aucune capacité Linux, pas d'élévation de privilèges.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - worker_logs:/app/logs
      # Pas de bind mount pour db/ : les migrations sont embarquées dans l'image
      # (un montage relatif n'est pas appliqué par Dokploy).
    healthcheck:
      # Base joignable (détail : `python -m worker.healthcheck`) ; une recherche indisponible n'est pas critique, le worker attend et reprend.
      # Sans effet sur le fonctionnement : sert de signal dans Dokploy / `docker compose ps`.
      test: ["CMD-SHELL", "python -m worker.healthcheck --quiet"]
      interval: 10m
      timeout: 30s
      retries: 3
      start_period: 5m

networks:
  db:
    internal: true
  egress:
  dokploy-network:
    external: true

volumes:
  mysql_data:
  worker_logs:
  searxng_cache:
